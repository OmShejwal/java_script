<!DOCTYPE html>
<html>

<head>
  <title>Rock paper secissors</title>

  <style>

  </style>
</head>

<body>
  <p>
    Rock Paper Scissors
  </p>

  <button onclick="
  playGame('rock');
">Rock</button>






  <button onclick="

  playGame('paper');
  ">Paper</button>




  <button onclick="
     playGame('scissors');"
   
  >Scissors</button>


  <button onclick="
  score.wins=0;
  score.losses=0;
  score.ties=0;
  localStorage.removeItem('score');
  ">Reset Score</button>



  <script>
  const score =  JSON.parse(localStorage.getItem
  ('score')) ||{
    
      wins:0,
      losses:0,
      ties:0
    };
  

  /*
  if(!score) {
    score={
      wins:0,
      losses:0,
      ties:0
    };
  } 
  */


  function playGame(playMove) {
    const computerMove = pickComputerMove();
    let result = '';

    if (playMove === 'scissors') {
      if (computerMove === 'rock') {
        result = 'lose';
      } else if (computerMove === 'paper') {
        result = 'win';
      } else {
        result = 'tie';
      }
    } else if (playMove === 'paper') {
      if (computerMove === 'rock') {
        result = 'win';
      } else if (computerMove === 'paper') {
        result = 'tie';
      } else {
        result = 'lose';
      }
    } else if (playMove === 'rock') {
      if (computerMove === 'rock') {
        result = 'tie';
      } else if (computerMove === 'paper') {
        result = 'lose';
      } else {
        result = 'win';
      }
    }

    if (result === 'win') {
      score.wins += 1;
    } else if (result === 'lose') {
      score.losses += 1;
    } else {
      score.ties += 1;
    }



    localStorage.setItem('score',JSON.stringify
      (score)
    );

        alert(`You picked ${playMove}. Computer picked ${computerMove}. Result: ${result}
Wins: ${score.wins}, Losses: ${score.losses}, Ties: ${score.ties}`);
      }

  function pickComputerMove() {
    const randomNumber = Math.random();
    if (randomNumber < 1/3) return 'rock';
    else if (randomNumber < 2/3) return 'paper';
    else return 'scissors';
  }
</script>

</body>

</html>
