 <!DOCTYPE html>
<html>
  <head>
    <title>Dom project</title>
    <style>


     body{
        font-family: Arial;
      }

      .subscribe-button{
        border: none;
        background-color: black;
        color: white;
        padding-top:10px; 
        padding-bottom: 10px;
        padding-left: 10px;
        padding-right: 15px;
        padding-left: 15px;
        font-weight: bold;
        border-radius :50px;
        cursor: pointer;
        margin-bottom: 50px;

      }

      .is-subscribe{
        background-color:  rgb(240, 240, 240);
        color: black;
      }
      
      .cost-input{
        font-size: 15px;
        padding: 10px;
      }
 
      .calculate-button{
        border: none;
        background-color: green;
        color: white;
        font-size: 15px;
        padding: 12px;
        cursor: pointer;
      }
    </style>
  </head>
    <body> 
      <p>Youtube Subscribe Button</p>
       <button onclick="
       Subscribe();
       
      "class="js-subscribe-button   subscribe-button" >
      Subscribe
    
     </button>

     <p>Amazon Shipping Calaculator</p>
     <p>Order Under $40=+$10 Shipping</p>
     <p>Orrder Over $40 = FREE Shipping</p>
     <input placeholder="cost of order" class="js-cost-input   cost-input"
     onkeydown=" 
       handleCostkeydown(event);
      
      
      
      " >
     <button 
     onclick="
        calculateTotal()
     
     "
     class="calculate-button"
     >Calculate</button>
     <p class="js-total-cost"></p>

      <script>

       String(25)
       console.log('25'-5);
        
        function handleCostkeydown(event){
            
      if (event.key==='Enter'){
         calculateTotal();
        }
      }


       function calculateTotal(){
        const inputElement = document.querySelector('.js-cost-input');
        let cost=Number(inputElement.value);
        

       if(cost <40){
        cost=cost +10;
    

       }
        document.querySelector('.js-total-cost')
          .innerHTML =`$${cost}`;
       }


        function Subscribe(){
      const buttonElement =document.querySelector('.js-subscribe-button')
          
          if(buttonElement.innerText ==='Subscribe'){
            buttonElement.innerHTML ='Subscribed'
            buttonElement.classList.add('is-subscribe')
          }else{
            buttonElement.innerHTML = 'Subscribe';
            buttonElement.classList.remove('is-subscribe')
          }

        }
      </script>
    </body>
</html>
